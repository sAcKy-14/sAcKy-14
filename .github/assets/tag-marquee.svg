<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="82" viewBox="0 0 1200 82" role="img" aria-label="Flowing interest tags">
  <defs>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="7%" stop-color="#050505" stop-opacity="0"/>
      <stop offset="93%" stop-color="#050505" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="pillHot" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#190008"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#190008"/>
      <stop offset="18%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="82%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#190008"/>
    </linearGradient>
    <linearGradient id="capsuleEdge" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="58%" stop-color="#e11d48" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .track { animation: scroll 24s linear infinite; }
      .frame { fill: #080808; stroke: url(#edge); stroke-width: 1.5; stroke-dasharray: 72 24; animation: frameFlow 5s linear infinite, frameGlow 3s ease-in-out infinite; }
      .innerFrame { fill: none; stroke: #e11d48; stroke-width: .7; opacity: .55; stroke-dasharray: 8 10; animation: dash 3s linear infinite reverse; }
      .corner { fill: none; stroke: #ffffff; stroke-width: 2; stroke-linecap: round; filter: url(#glow); animation: cornerPulse 1.7s ease-in-out infinite alternate; }
      .pill { fill: #090909; stroke: #2a0710; stroke-width: 1.2; filter: drop-shadow(0 0 2px #e11d48); }
      .hot { fill: url(#pillHot); }
      .pillEdge { fill: none; stroke: url(#capsuleEdge); stroke-width: 1.7; stroke-dasharray: 42 126; stroke-linecap: round; animation: capsuleFlow 2.6s linear infinite; }
      .hotEdge { stroke-width: 2; stroke-dasharray: 58 94; }
      .label { fill: #ffffff; stroke: #190008; stroke-width: 3px; paint-order: stroke; font: 800 16px "JetBrains Mono", "Fira Code", monospace; letter-spacing: .2px; dominant-baseline: middle; text-anchor: middle; }
      .dot { fill: #e11d48; filter: url(#glow); animation: blink 1.2s ease-in-out infinite alternate; }
      .rail { stroke: #e11d48; stroke-width: 1; stroke-dasharray: 2 18; stroke-linecap: round; animation: dash 1.8s linear infinite; opacity: .75; }
      .scan { animation: scan 3s ease-in-out infinite; }
      @keyframes scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-1560px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -44; }
      }
      @keyframes frameFlow {
        to { stroke-dashoffset: -192; }
      }
      @keyframes capsuleFlow {
        to { stroke-dashoffset: -168; }
      }
      @keyframes frameGlow {
        0%, 100% { filter: drop-shadow(0 0 2px #e11d48); }
        50% { filter: drop-shadow(0 0 8px #e11d48); }
      }
      @keyframes cornerPulse {
        from { opacity: .45; }
        to { opacity: 1; }
      }
      @keyframes blink {
        from { opacity: .35; }
        to { opacity: 1; }
      }
      @keyframes scan {
        0% { transform: translateX(-280px); opacity: 0; }
        18% { opacity: .85; }
        82% { opacity: .85; }
        100% { transform: translateX(1280px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .track, .frame, .innerFrame, .corner, .pillEdge, .rail, .scan, .dot { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="82" fill="#050505"/>
  <rect class="frame" x="8" y="9" width="1184" height="64" rx="16"/>
  <rect class="innerFrame" x="16" y="16" width="1168" height="50" rx="12"/>
  <path class="corner" d="M22 27V19H68M1132 19H1178V27M22 55V63H68M1132 63H1178V55"/>
  <path class="rail" d="M34 25H1166M34 57H1166"/>
  <path d="M0 41H1200" stroke="#ffffff" stroke-width=".5" opacity=".16"/>
  <rect class="scan" x="-170" y="12" width="190" height="58" fill="url(#sweep)" opacity=".52"/>

